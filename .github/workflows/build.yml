name: build
on:
  workflow_call:
    outputs:
      versionid:
        description: The version ID of the build
        value: ${{ jobs.build.outputs.versionid }}
jobs:
  build:
    runs-on: windows-latest
    outputs:
      versionid: ${{ steps.build-step.outputs.versionid }}
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET CLI
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      id: build-step
      shell: pwsh
      run: |
        # Derive version ID from git sha (first 10 chars)
        $shaShort = "${{ github.sha }}".Substring(0, 10)
        $versionSuffix = "alpha.$shaShort"

        # Read version prefix from Core project
        $versionPrefix = [xml](Get-Content Core/Key2Joy.Core/Key2Joy.Core.csproj) |
          Select-Xml -XPath "/Project/PropertyGroup/VersionPrefix" |
          Select-Object -ExpandProperty Node |
          Select-Object -ExpandProperty "#text"

        $fullVersionId = "$versionPrefix-$versionSuffix"
        Write-Output "Building Key2Joy $fullVersionId"

        dotnet publish Key2Joy.App/Key2Joy.App.csproj `
          -c Release `
          -r win-x64 `
          -p:Platform=x64 `
          -p:SelfContained=true `
          -p:WindowsAppSDKSelfContained=true `
          -p:WindowsPackageType=None `
          -p:PublishSingleFile=false `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:PublishProfile= `
          -o bin\Key2Joy.App\Release\win-x64

        echo "versionid=$fullVersionId" >> $env:GITHUB_OUTPUT
    - name: Cache the build output
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}
        key: ${{ runner.os }}-build-${{ github.sha }}
